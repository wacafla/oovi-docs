name: Apply documentation update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        shell: bash
        run: |
          base64 -d > /tmp/docs.patch <<'PATCH_EOF'
          
          PATCH_EOF
          git apply /tmp/docs.patch
          rm .github/workflows/update-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update playbook for proactive domain drops"
          git push
