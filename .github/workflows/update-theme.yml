name: Apply Read the Docs theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme
        shell: bash
        run: |
          base64 -d > /tmp/theme.patch <<'PATCH_EOF'
          
          PATCH_EOF
          git apply /tmp/theme.patch
          rm .github/workflows/update-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch site to Read the Docs theme"
          git push
